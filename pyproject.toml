[project]
name = "devision"
version = "0.1.0"
description = "Vision decision model: image + questions -> Jev-format calibrated answers"
requires-python = ">=3.11"
dependencies = [
    "laya==0.3.22",
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.13",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "httpx>=0.27"]

[project.scripts]
devision-fetch = "devision.cli:fetch_main"
devision-convert = "devision.cli:convert_main"
devision-train = "devision.cli:train_main"
devision-eval = "devision.cli:eval_main"
devision-serve = "devision.cli:serve_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny model end to end (seconds to a minute on CPU)"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
