# not 4 (POPE NLL 0.372 -> 0.454, size 0.350 -> 0.440; runs/v04-interp/a1.0/compare/accept_v04.md). One pass from
# runs/r20-science/train over data/n2/soft_mix.jsonl (scripts/data/n2/soft_mix.py: 40,000 existence + 4,331 size
# questions with golds 0.9 / 0.1, 60,000 unchanged replay); --val is data/v5/dev_mix.jsonl (balanced sources), so the
# final temperatures are fitted there. r20's settings and evaluation sets.
