# Release v0.2 of deVision on the Hugging Face Hub (release/README.md explains the steps).
version: v0.2                          # HF tag; model version (training rounds are named separately)
git_tag: model-v0.2                    # GitHub tag of the code this release is built and installed from
model_name: devision-v0.2              # what the API reports as "model"
round: runs/v11-v9b-recovery           # training round (current best; see docs/training-log.md)
stage: stage2
hub_repo: lukbit/devision              # private until the project owner says to publish
license: apache-2.0
base_model: [convaiinnovations/laya, google/siglip2-base-patch16-256]
datasets:                              # what the model was trained on (card metadata)
  - HuggingFaceM4/VQAv2
  - lmms-lab/GQA
  - HuggingFaceM4/A-OKVQA
  - derek-thomas/ScienceQA
  - HuggingFaceM4/the_cauldron
  - cambridgeltl/vsr_random
cpu_latency: runs/r12/cpu/A.single.json   # devision-eval --device cpu --no-group on this checkpoint (structure screen, 2026-10-06)
