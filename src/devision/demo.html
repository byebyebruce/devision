<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devision demo</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f6fdb; --accent-soft: #dfe9fb; --bar: #c9d8f5; --good: #2e8b57; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --line: #33332f;
      --accent: #6ea0ff; --accent-soft: #23304a; --bar: #2c3e63; --good: #5cc18a; --bad: #ef6f5f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
         display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  #drop { border: 1.5px dashed var(--line); border-radius: 8px; min-height: 220px; display: grid;
          place-items: center; cursor: pointer; color: var(--muted); text-align: center; overflow: hidden; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop img { max-width: 100%; max-height: 360px; display: block; }
  #examples img { height: 56px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  #examples img.on { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .q { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .q .row + .row { margin-top: 8px; }
  input[type=text], select { font: inherit; color: var(--text); background: var(--bg);
         border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input[type=text] { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); font-size: 13px; }
  .presets button { font-size: 13px; padding: 3px 8px; }
  .ans { margin-top: 14px; }
  .ans h3 { margin: 0 0 6px; font-size: 14px; }
  .bar { position: relative; height: 26px; border-radius: 5px; background: var(--bg); margin: 4px 0;
         overflow: hidden; border: 1px solid var(--line); }
  .bar > div { position: absolute; inset: 0 auto 0 0; background: var(--bar); }
  .bar.top > div { background: var(--accent); opacity: .55; }
  .bar span { position: relative; padding: 0 8px; line-height: 26px; font-size: 13px;
              display: flex; justify-content: space-between; }
  .err { color: var(--bad); white-space: pre-wrap; }
  details { margin-top: 16px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow: auto; font-size: 12px; max-height: 320px; }
</style>
</head>
<body>
<header>
  <h1>devision · 视觉决策 demo</h1>
  <p id="meta">图片 + 问题 → 校准概率（Jev <code>/v1/systemone</code> 格式）</p>
</header>
<main>
  <section>
    <h2>1. 图片</h2>
    <div id="drop" tabindex="0">点击或拖入一张图片</div>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="examples" class="row" style="margin-top:8px"></div>
    <p class="muted">服务端会保持比例缩放并补灰边到 256×256。不传图则按纯文本请求处理。</p>

    <h2 style="margin-top:18px">2. 问题（英文）</h2>
    <div class="row presets">
      <span class="muted">示例：</span>
      <button data-preset="dog">有没有狗</button>
      <button data-preset="pose">站着还是坐着</button>
      <button data-preset="color">主色</button>
    </div>
    <div id="questions"></div>
    <div class="row" style="margin-top:10px">
      <button id="add-noul">+ 是/否题</button>
      <button id="add-choice">+ 选择题</button>
      <span style="flex:1"></span>
      <button id="run" class="primary">提交</button>
    </div>
  </section>

  <section>
    <h2>3. 结果</h2>
    <div id="status" class="muted">还没有提交。</div>
    <div id="answers"></div>
    <details><summary class="muted">原始请求 / 响应</summary><pre id="raw"></pre></details>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let imageB64 = null;

// ---- image ----
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") file.click(); };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && load(file.files[0]);
function load(f) {
  const r = new FileReader();
  r.onload = () => {
    imageB64 = String(r.result).split(",")[1];
    drop.innerHTML = "";
    const img = new Image(); img.src = r.result; img.alt = f.name; drop.appendChild(img);
  };
  r.readAsDataURL(f);
}

// ---- example images: thumbnails, the first one preloaded ----
async function loadExample(name, thumb) {
  const blob = await (await fetch("/examples/" + encodeURIComponent(name))).blob();
  load(new File([blob], name, { type: blob.type }));
  document.querySelectorAll("#examples img").forEach((t) => t.classList.toggle("on", t === thumb));
}
fetch("/examples").then((r) => r.json()).then((names) => {
  if (!names.length) return;
  const box = $("#examples");
  box.innerHTML = '<span class="muted">示例：</span>';
  names.forEach((n, i) => {
    const t = new Image(); t.src = "/examples/" + encodeURIComponent(n); t.alt = n; t.title = n;
    t.onclick = () => loadExample(n, t);
    box.appendChild(t);
    if (i === 0) loadExample(n, t);
  });
}).catch(() => {});

// ---- questions ----
const list = $("#questions");
function addQuestion(type, text = "", options = "") {
  const el = document.createElement("div");
  el.className = "q"; el.dataset.type = type;
  el.innerHTML = `
    <div class="row">
      <strong style="font-size:13px">${type === "noul" ? "是/否" : "选择"}</strong>
      <input type="text" class="ins" placeholder="${type === "noul" ? "Is there a dog in the image?" : "Is the person standing or sitting?"}">
      <button class="rm" title="删除">✕</button>
    </div>
    ${type === "choice" ? `<div class="row"><span class="muted">选项</span>
      <input type="text" class="opts" placeholder="standing, sitting, lying（逗号分隔）"></div>` : ""}`;
  el.querySelector(".ins").value = text;
  if (type === "choice") el.querySelector(".opts").value = options;
  el.querySelector(".rm").onclick = () => el.remove();
  list.appendChild(el);
}
const PRESETS = {
  dog: ["noul", "Is there a dog in the image?"],
  pose: ["choice", "Is the person standing or sitting?", "standing, sitting"],
  color: ["choice", "What is the main color of the image?", "red, green, blue, black, white"],
};
document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => addQuestion(...PRESETS[b.dataset.preset]));
$("#add-noul").onclick = () => addQuestion("noul");
$("#add-choice").onclick = () => addQuestion("choice");
addQuestion(...PRESETS.dog); addQuestion(...PRESETS.pose);

function buildRequest() {
  const questions = {};
  [...list.children].forEach((el, i) => {
    const q = { type: el.dataset.type, instructions: el.querySelector(".ins").value.trim() };
    if (q.type === "choice") {
      q.criteria = {};
      el.querySelector(".opts").value.split(",").map((s) => s.trim()).filter(Boolean)
        .forEach((o) => q.criteria[o] = null);
    }
    questions["q" + (i + 1)] = q;
  });
  const state = imageB64 ? [{ type: "image", base64: imageB64 }] : "";
  return { model: "devision", state, questions };
}

// ---- submit ----
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function bar(label, p, top) {
  return `<div class="bar ${top ? "top" : ""}"><div style="width:${(p * 100).toFixed(1)}%"></div>
    <span><b>${esc(label)}</b><span>${(p * 100).toFixed(1)}%</span></span></div>`;
}
$("#run").onclick = async () => {
  const body = buildRequest();
  if (!Object.keys(body.questions).length) { $("#status").textContent = "至少加一个问题。"; return; }
  $("#run").disabled = true; $("#status").textContent = "推理中…"; $("#answers").innerHTML = "";
  const shown = JSON.parse(JSON.stringify(body));
  if (imageB64) shown.state[0].base64 = `<${imageB64.length} chars>`;
  const t0 = performance.now();
  try {
    const res = await fetch("/v1/systemone", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    const ms = performance.now() - t0;
    $("#raw").textContent = "// request\n" + JSON.stringify(shown, null, 2) + "\n\n// response\n" + JSON.stringify(data, null, 2);
    if (!res.ok) { $("#status").innerHTML = `<span class="err">${res.status}: ${esc(data.error || JSON.stringify(data))}</span>`; return; }
    $("#status").textContent = `${ms.toFixed(0)} ms（含网络与图片上传）· input_tokens ${data.usage.input_tokens} · ${data.model}`;
    $("#answers").innerHTML = Object.entries(data.answers).map(([id, a]) => {
      const q = body.questions[id];
      if (a.type === "noul") {
        return `<div class="ans"><h3>${esc(q.instructions)}</h3>${bar("yes", a.noul, a.noul >= .5)}${bar("no", 1 - a.noul, a.noul < .5)}</div>`;
      }
      const rows = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1])
        .map(([o, p]) => bar(o, p, o === a.choice)).join("");
      return `<div class="ans"><h3>${esc(q.instructions)}</h3>${rows}
        <div class="muted">choice: <b>${esc(a.choice)}</b> · confidence ${a.confidence.toFixed(3)}</div></div>`;
    }).join("");
  } catch (e) {
    $("#status").innerHTML = `<span class="err">${esc(e)}</span>`;
  } finally {
    $("#run").disabled = false;
  }
};

fetch("/health").then((r) => r.json()).then((h) => $("#meta").innerHTML += ` · 模型 <b>${esc(h.model)}</b>`).catch(() => {});
</script>
</body>
</html>
