# Round 9 screen S-mix (critic/plan-round9-v9.md, step 0; not a round): does the gain of a focused left/right run
# survive a mix with replay, one pass? From v8, 7,200 questions = left/right 1/2: 1,800 pairs (900 position, 450 relation choice, 450 relation yes/no) + 3,600 replay
# (scripts/data/v9_mix.py, data/v9/smix12/MIX.json). Monitored every 150 steps on dev_lr_pairs (the temperature
# fit there is a side effect, the decision uses both-right on argmax); dev_mix only at the end, against v8's
# existing records. Go / stop: plan section 5, computed with scripts/pair_stats.py --base.
#   uv run devision-pipeline configs/r9-smix12.yaml
name: r9-smix12
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v8-vsr-v7w/stage2
    data: data/v9/smix12/train.jsonl
    val: data/v6/dev_lr_pairs.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 50, eval_every: 150}

evaluate:
  image_identity: data/v5/image_identity.json
  sets:
    dev_lr_pairs: data/v6/dev_lr_pairs.jsonl
    dev_mix: data/v5/dev_mix.jsonl
