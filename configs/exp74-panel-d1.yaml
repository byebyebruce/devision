# EXP74 D1 -- panel binding alignment on a copy of the frozen K candidate's decision weights (PANEL-LEARN-PREP-01;
# docs/experiments/2026-10-19-panel-learn-plan.md). Not a round, no release candidate. EXP26's alignment stage
# (configs/exp26-align.yaml) with the same data and settings except: init = the frozen candidate (read only), 1 epoch
# instead of 2 (budget), eval every 625 steps. align updates the projector and a new LoRA on ModernBERT (merged on save);
# SigLIP, the question conditioning and the local-view geometry stay frozen; the caption picture is the full picture
# (align._full_picture). Gate: scripts/exp24/gate.py on its align_report (gap >= 0.30) before D2.
name: exp74-panel-d1
device: mps
common:
  log_every: 50
stages:
  - name: d1
    kind: align
    init: runs/v04-k/cand
    data: data/exp26/align_train.jsonl
    val: data/exp26/align_val.jsonl
    params:
      epochs: 1
      batch: 16
      lr: 2.0e-5
      lora_r: 16
      lora_alpha: 32
      lr_lora: 1.0e-4
      warmup: 100
      mask_prob: 0.5
      max_caption_tokens: 40
      eval_every: 625
      seed: 0
evaluate:
  sets: {}
