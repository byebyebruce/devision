# exp14 quick check (owner 2026-10-12, not a round): PixMo-Points counting supervision vs replay at an equal budget.
# Both arms: v12 start, 16,000 questions (scripts/exp14/build.py -> data/exp14/), 2,000 steps, the v12-retrain
# learning rates, warmup 100, cosine to 0, seed 0; the arms differ only in data (train_base vs train_pixmo).
# Compared B - A per question at the last step (monitor/step2000, temperature 1); reading rules in
# docs/experiments/2026-10-12-exp14-pixmo.md, written before the run.
name: exp14-base
device: mps
common:
  log_every: 100

stages:
  - name: stage2
    kind: train
    init: runs/v12-ext/stage2
    data: data/exp14/train_base.jsonl
    val: data/r13b/val.jsonl
    eval: {exist: data/r13b/panel_exist.jsonl, science: data/r13b/panel_science.jsonl, ext: data/ext/dev_ext.jsonl,
           bind_gqa: data/r13/gqa/dev_bind_gqa.jsonl, count_narrow: data/v11/dev_count_transfer.jsonl,
           count_wide: data/r13b/count_wide.jsonl, px_wide: data/exp14/pixmo_count_wide.jsonl,
           px_narrow: data/exp14/pixmo_count_narrow.jsonl, px_exist: data/exp14/pixmo_exist.jsonl}
    params: {epochs: 1, lr_new: 2.0e-5, lr_head: 1.0e-5, lr_lora: 5.0e-5, warmup: 100, eval_every: 2000,
             save_every: 500, amp: "off", seed: 0, monitor_details: true}
