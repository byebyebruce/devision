# Round 13 screen s2 (docs/experiments/2026-10-08-r13-binding-plan.md, revision 2, step 2). Not a round: an
# experiment. S0 = data only, S1 = + grounding loss, S2 = + question-conditioned visual tokens. All three share
# this recipe exactly (v12 start, the same 16,000 questions from scripts/r13/screen_mix.py, 2,000 steps, v12's
# learning rates, warmup 100, cosine to 0, last-step checkpoint, temperatures fitted on dev_mix).
#   nohup uv run devision-pipeline configs/exp13-s2.yaml > runs/exp13-s2.out 2>&1 &
name: exp13-s2
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v12-ext/stage2
    data: data/r13/screen/train.jsonl
    val: data/v5/dev_mix.jsonl              # temperature fit (calibration_fit)
    eval: {bind_gqa: data/r13/gqa/dev_bind_gqa.jsonl, bind_cf: data/r13/screen/dev_bind_cf_watch.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, lr_cond: 1.0e-4, warmup: 100,
             eval_every: 500, save_every: 500, amp: "off", seed: 0, question_conditioning: true}

evaluate:
  image_identity: data/v5/image_identity.json
  sets:
    dev_mix: data/v5/dev_mix.jsonl
    dev_bind_cf: {path: data/r13/synth-v2/dev_bind_cf.jsonl, role: monitoring}
    dev_bind_gqa: {path: data/r13/gqa/dev_bind_gqa.jsonl, role: monitoring}
