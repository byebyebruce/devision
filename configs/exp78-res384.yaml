# exp78 (docs/experiments/2026-10-22-exp78-resolution-plan.md): arm 384 -- v0.4 trained 20,000 steps on data/exp78/train.jsonl
# at input 384 (the two arms differ only in the input size). Not a round.
#   UV_NO_SYNC=1 HF_HUB_OFFLINE=1 nohup uv run devision-pipeline configs/exp78-res384.yaml > runs/exp78-res384.out 2>&1 &
name: exp78-res384
device: cuda
common:
  log_every: 100

stages:
  - name: train
    kind: train
    init: runs/exp78/v04-384
    data: data/exp78/train.jsonl
    val: data/v5/dev_mix.jsonl
    params: {epochs: 1, lr_new: 2.0e-5, lr_head: 1.0e-5, lr_lora: 5.0e-5, warmup: 300, eval_every: 0,
             vision_unfreeze_top: 4, lr_vision: 5.0e-6, seed: 0}

evaluate:
  controls: false
  sets:
    dev_count: {path: data/n2/dev_count.jsonl, role: monitoring}
    dev_tallyqa: {path: data/n2/dev_tallyqa.jsonl, role: monitoring}
    dev_sqa: {path: data/n2/dev_sqa.jsonl, role: monitoring}
    dev_v7w: {path: data/n2/dev_v7w.jsonl, role: monitoring}
    dev_spatial: {path: data/n2/dev_spatial.jsonl, role: monitoring}
    dev_coco_exist: {path: data/v2/dev_coco_exist.jsonl, role: monitoring}
    dev_mix: {path: data/v5/dev_mix.jsonl, role: calibration_fit}
