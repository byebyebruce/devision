# Round 16 -- v0.3 trained on data-n1, a newly built set (docs/experiments/2026-10-20-r16-cuda-plan.md, owner
# 2026-10-20: build a new training set rather than re-run the old experiments; aim past v0.3). Starts from v0.3
# (runs/v03/model = HF lukbit/devision af353dc...), one pass over data/n1/train_mix.jsonl (full VQAv2 train with the
# annotators' answers as soft gold, GQA balanced train on all 21 shards with open questions, a replay of v0.3's
# other abilities), bf16 (EXP77), exp21's settings for continuing from r15 (top 4 SigLIP layers unfrozen).
# The evaluation sets are configs/v03-baseline.yaml's, so every set pairs question by question with runs/v03/eval/.
#   scripts/data/n1_vqav2.py, n1_gqa.py, n1_mix.py build the data
#   UV_NO_SYNC=1 HF_HUB_OFFLINE=1 nohup uv run devision-pipeline configs/r16-n1.yaml > runs/r16-n1.out 2>&1 &
name: r16-n1
device: cuda
common:
  log_every: 100

stages:
  - name: train
    kind: train
    init: runs/v03/model
    data: data/n1/train_mix.jsonl
    val: data/n1/dev_mix.jsonl
    params: {epochs: 1, lr_new: 2.0e-5, lr_head: 1.0e-5, lr_lora: 5.0e-5, warmup: 300, eval_every: 5000,
             vision_unfreeze_top: 4, lr_vision: 5.0e-6, seed: 0}

evaluate:
  image_identity: data/v5/image_identity.json
  controls: true
  sets:
    dev_mix: data/v5/dev_mix.jsonl
    test_vsr: data/v5/test_vsr.jsonl
    test_v7w: data/v5/test_v7w.jsonl
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
    test_position_flip: data/v6/test_position_flip.jsonl
    test_relation_flip: data/v6/test_relation_flip.jsonl
    bench_lv_vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl
    bench_lv_aokvqa: data/lv_bench/aokvqa.jsonl
    bench_lv_scienceqa: data/lv_bench/scienceqa.jsonl
    bench_lv_pope: data/lv_bench/pope.jsonl
