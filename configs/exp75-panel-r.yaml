# EXP75 arm R (PANEL-NUMBER-PREP-01; docs/experiments/2026-10-20-panel-number-plan.md): one more alignment pass from
# EXP74's D1 end point with the original random mask. The two arms (configs/exp75-panel-n.yaml / -r.yaml) differ only in name / output and
# number_mask_sources; data, batch, learning rates, warmup, LoRA, seed and the random validation are D1's. Each arm
# builds a new LoRA and optimizer: not an exact second pass of EXP26.
name: exp75-panel-r
device: mps
common:
  log_every: 50
stages:
  - name: r
    kind: align
    init: runs/exp74-panel-d1/d1
    data: data/exp26/align_train.jsonl
    val: data/exp26/align_val.jsonl
    params:
      epochs: 1
      batch: 16
      lr: 2.0e-5
      lora_r: 16
      lora_alpha: 32
      lr_lora: 1.0e-4
      warmup: 100
      mask_prob: 0.5
      max_caption_tokens: 40
      eval_every: 625
      seed: 0
evaluate:
  sets: {}
