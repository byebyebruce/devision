# exp38 arm H: 512 input / 256 visual tokens (exp37-L's weights byte-identical, config image_size 512 with interpolated SigLIP position embeddings; scripts/exp38/convert.py) -- docs/experiments/2026-10-17-exp38-512-plan.md; critic EXP38-PREP-01. Both arms start from exp37-L's
# end (sha256 f9fc93c2...), train on exp36's original-picture 16,000 rows (912a9cd2...) with exp36-B's full-number
# mask, 1,000 steps, every other setting as exp36-B; the YAMLs differ only in name and init.
name: exp38-h
device: mps
common:
  log_every: 50
stages:
- name: stage1
  kind: align
  init: runs/exp38-init-512
  data: data/exp36/align_mix.jsonl
  val: data/real_layout/captions_tune.jsonl
  params:
    epochs: 1
    batch: 16
    lr: 2.0e-05
    lora_r: 16
    lora_alpha: 32
    lr_lora: 1.0e-04
    warmup: 100
    mask_prob: 0.5
    max_caption_tokens: 44
    eval_every: 500
    seed: 0
    track_sources: real-layout-temp,real-layout-force
    number_mask_sources: real-layout-temp,real-layout-force
