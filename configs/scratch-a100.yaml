# Single A100 80GB starting recipe, using the same data and stages as scratch.yaml.
# Batch 32 is a separate experiment: fewer optimizer updates per epoch, unchanged learning rates.
# Warmup and evaluation intervals preserve approximately the original sample counts.
# Alignment currently runs in FP32; only the two decision stages support BF16 autocast.
# A100 throughput, peak memory and model quality have not yet been measured.
#   uv run devision-pipeline configs/scratch-a100.yaml
# Third CUDA GPU (zero-based index 2, ordered by PCI bus):
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=2 uv run devision-pipeline configs/scratch-a100.yaml
name: scratch-a100
device: cuda
common:
  log_every: 50

stages:
  - name: align
    kind: align
    data: data/align_full_train.jsonl
    val: data/align_val.jsonl
    params:
      epochs: 2
      batch: 32
      lr: 1.0e-3
      lora_r: 16
      lr_lora: 1.0e-4
      warmup: 25
      eval_every: 250

  - name: stage2a
    kind: train
    init: align
    data: data/v2/train_mix.jsonl
    val: data/v2/dev_mix_half.jsonl
    params:
      epochs: 1
      micro_batch: 32
      lr_new: 5.0e-5
      lr_head: 5.0e-5
      lr_lora: 1.0e-4
      lora_r: 16
      warmup: 125
      eval_every: 500
      amp: cuda

  - name: stage2b
    kind: train
    init: stage2a
    data: data/v3/train_cont.jsonl
    val: data/v3/dev_mix.jsonl
    params:
      epochs: 1
      micro_batch: 32
      lr_new: 5.0e-5
      lr_head: 5.0e-5
      lr_lora: 1.0e-4
      lora_r: 16
      warmup: 125
      eval_every: 500
      amp: cuda

evaluate:
  image_identity: data/v2/image_identity.json
  controls: true
  sets:
    dev_mix: data/v3/dev_mix.jsonl
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
    bench_lv_vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl
    bench_lv_aokvqa: data/lv_bench/aokvqa.jsonl
    bench_lv_scienceqa: data/lv_bench/scienceqa.jsonl
    bench_lv_pope: data/lv_bench/pope.jsonl
