# exp21 (docs/experiments/2026-10-15-exp21-reading-plan.md; owner 2026-10-15: ScienceQA parity is the goal): can
# r15 / v0.3 learn to read printed numbers -- read panel A, read panel B, compare -- at 6 / 8 / 11 / 16 px of
# digit ink in the 256 x 256 input? Init r15, its settings (top 4 SigLIP layers at 5e-6, learning rates, seed 1),
# warmup 100, synthetic reading data (scripts/data/exp21_reading.py) + r14b replay 1:1, one pass; runs only after
# scripts/exp21/precheck.py says so, stopped by scripts/exp21/chain.sh once step 2000 is recorded; readout
# scripts/exp21/report.py. Not a round, no adoptable model.
name: exp21-reading
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/r15-vision/stage2
  data: data/exp21/train_mix.jsonl
  val: data/r13b/val.jsonl
  eval:
    syn: data/exp21/dev_syn.jsonl
    syn_erased: data/exp21/dev_syn_erased.jsonl
    syn_text: data/exp21/dev_syn_text.jsonl
    sqa_temp: data/exp21/dev_sqa_temp.jsonl
    sqa_force: data/exp21/dev_sqa_force.jsonl
    sqa_temp_mism: data/exp21/dev_sqa_temp_mism.jsonl
    sqa_force_mism: data/exp21/dev_sqa_force_mism.jsonl
    sqa_text: data/exp21/sqa_text.jsonl
    sqa_blank: data/exp21/sqa_blank.jsonl
    exist: data/r13b/panel_exist.jsonl
    science: data/r13b/panel_science.jsonl
    ext: data/ext/dev_ext.jsonl
    count_wide: data/r13b/count_wide.jsonl
    count_narrow: data/v11/dev_count_transfer.jsonl
    flip: data/v6/dev_lr_pairs.jsonl
    vsr: data/v5/dev_vsr.jsonl
  params:
    epochs: 1
    micro_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 1000
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
