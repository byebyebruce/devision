# Round 13: binding (docs/experiments/2026-10-08-r13-binding-plan.md). The owner adopted the exp13-long recipe as a
# trade-off on 2026-10-10 (its synthetic gate 0.643 < 0.8 failed; real-photo binding +5.09 [+2.36, +7.76], dev_mix
# flat) and asked for the round: v12 + S2 (question-conditioned visual tokens) on every round-13 source in full plus
# 40,000 replay (scripts/r13/round_mix.py -> data/r13/round/), one pass, the screens' learning rates, warmup 500,
# cosine to 0, micro batches packed from counterfactual units, resume state every 500 steps (the M4 GPU hangs now
# and then; runs/r13/round_retry.sh resumes). Full evaluation: configs/r13-binding-eval.yaml.
name: r13-binding
device: mps
common:
  log_every: 100

stages:
  - name: stage2
    kind: train
    init: runs/v12-ext/stage2
    data: data/r13/round/train.jsonl
    val: data/v5/dev_mix.jsonl              # temperature fit (calibration_fit)
    eval: {bind_gqa: data/r13/gqa/dev_bind_gqa.jsonl, bind_cf: data/r13/screen/dev_bind_cf_watch.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, lr_cond: 1.0e-4, warmup: 500,
             eval_every: 5000, save_every: 500, amp: "off", seed: 0, question_conditioning: true}

evaluate:
  image_identity: data/v5/image_identity.json
  sets:
    dev_mix: data/v5/dev_mix.jsonl
    dev_bind_cf: {path: data/r13/synth-v2/dev_bind_cf.jsonl, role: monitoring}
    dev_bind_gqa: {path: data/r13/gqa/dev_bind_gqa.jsonl, role: monitoring}
