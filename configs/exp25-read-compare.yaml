# exp25 (docs/experiments/2026-10-16-exp25-read-compare-plan.md; owner 2026-10-16 "可以搞吧"): from exp24's reading-
# aligned checkpoint, exp22's 16 px reading questions for two passes plus text comparison questions
# (scripts/exp25/build.py); otherwise exp22 / exp24 phase B's settings. Stopped by scripts/exp25/chain.sh once step
# 5000 is recorded; readout scripts/exp25/report.py. Not a round, no adoptable model.
name: exp25-read-compare
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/exp24-align/stage1
  data: data/exp25/train.jsonl
  val: data/exp22/fit.jsonl
  eval:
    dev16: data/exp22/dev16.jsonl
    dev: data/exp21/dev_syn.jsonl
    erased: data/exp21/dev_syn_erased.jsonl
    text: data/exp21/dev_syn_text.jsonl
  params:
    epochs: 2
    micro_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 1000
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
