# Our model on laya-vision's public benchmark (rebuilt by scripts/data/lv_bench.py, out of the repo):
# the exact questions of their published per-question predictions (VQAv2 yes/no without the 113
# annotator ties, A-OKVQA val, ScienceQA image val with hints as text) plus all of POPE. Evaluation only.
#   uv run devision-pipeline configs/v3-data2-lvbench.yaml
# Then pair with their published rows, on all questions and on the ones our training never saw:
#   uv run devision-compare data/lv_bench/laya-vision-201m.aokvqa.details.jsonl \
#       runs/v3-data2/eval/lv_aokvqa.details.jsonl [--only data/lv_bench/aokvqa.unseen.jsonl]
name: lvbench
stages: []

evaluate:
  checkpoint: runs/v3-data2/stage2
  calibration_fit: data/v2/dev_mix_half.jsonl
  history: [data/v2/dev_mix.jsonl]          # watched in training until step 4000
  image_identity: data/v2/image_identity.json
  prefix: lv_
  sets:
    vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl
    aokvqa: data/lv_bench/aokvqa.jsonl
    scienceqa: data/lv_bench/scienceqa.jsonl
    pope: data/lv_bench/pope.jsonl
