# exp26 phase A (docs/experiments/2026-10-16-exp26-bind-align-plan.md; owner 2026-10-16 "可以啊"): panel-binding
# alignment. From exp24's reading-aligned checkpoint, the same alignment stage and settings as exp24 phase A, on
# exp21-style two-panel pictures captioned "A: <quantity> <value> <unit>. B: ..." (scripts/data/exp26_panels.py):
# filling A's masked number needs the panel labelled A. Gate scripts/exp24/gate.py; phase B configs/exp26-fit.yaml.
name: exp26-align
device: mps
common:
  log_every: 50
stages:
- name: stage1
  kind: align
  init: runs/exp24-align/stage1
  data: data/exp26/align_train.jsonl
  val: data/exp26/align_val.jsonl
  params:
    epochs: 2
    batch: 16
    lr: 2.0e-05
    lora_r: 16
    lora_alpha: 32
    lr_lora: 1.0e-04
    warmup: 100
    mask_prob: 0.5
    max_caption_tokens: 40
    eval_every: 500
    seed: 0
