# exp37 arm S (every number at its original small size) -- docs/experiments/2026-10-17-exp37-digit-size-plan.md;
# critic EXP37-PREP-01. Both arms: exp36-B's full-number mask, from exp32's A2 end (sha256 8476145e...e297), the same
# 16,000 rows in exp36's order (real-layout pictures redrawn in one shared layout, S or L digits; COCO unchanged),
# 1,000 steps; the two YAMLs differ only in name and data.
name: exp37-s
device: mps
common:
  log_every: 50
stages:
- name: stage1
  kind: align
  init: runs/exp32-align/stage1
  data: data/exp37/align_mix_S.jsonl
  val: data/real_layout/captions_tune.jsonl
  params:
    epochs: 1
    batch: 16
    lr: 2.0e-05
    lora_r: 16
    lora_alpha: 32
    lr_lora: 1.0e-04
    warmup: 100
    mask_prob: 0.5
    max_caption_tokens: 44
    eval_every: 500
    seed: 0
    track_sources: real-layout-temp,real-layout-force
    number_mask_sources: real-layout-temp,real-layout-force
