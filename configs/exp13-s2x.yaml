# Round 13 screen S2, the one allowed extension (plan revision 2, step 2, rule 3): S2's dev_bind_gqa curve rose over
# its last 500 steps (0.668 -> 0.676), so it continues ONCE from its last-step checkpoint: 1,000 steps, warmup 50,
# the same peak learning rates, cosine to 0, then the same eligibility rules. Data: whole groups of the screen mix
# drawn with seed 1 to about 8,000 questions (data/r13/screen/extend.jsonl), fixed before the extension ran.
#   nohup uv run devision-pipeline configs/exp13-s2x.yaml > runs/exp13-s2x.out 2>&1 &
name: exp13-s2x
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/exp13-s2/stage2
    data: data/r13/screen/extend.jsonl
    val: data/v5/dev_mix.jsonl              # temperature fit (calibration_fit)
    eval: {bind_gqa: data/r13/gqa/dev_bind_gqa.jsonl, bind_cf: data/r13/screen/dev_bind_cf_watch.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, lr_cond: 1.0e-4, warmup: 50,
             eval_every: 500, save_every: 500, amp: "off", seed: 0, question_conditioning: true}

evaluate:
  image_identity: data/v5/image_identity.json
  sets:
    dev_mix: data/v5/dev_mix.jsonl
    dev_bind_cf: {path: data/r13/synth-v2/dev_bind_cf.jsonl, role: monitoring}
    dev_bind_gqa: {path: data/r13/gqa/dev_bind_gqa.jsonl, role: monitoring}
