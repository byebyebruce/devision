# Round 16 -- the first round on local CUDA (RTX 5070 12 GB), trained from scratch for v0.4
# (docs/experiments/2026-10-20-r16-cuda-scratch-plan.md, owner 2026-10-20). Step 1 of the plan: the first half of
# v0.3's lineage (round 2's align, then the data of rounds 3, 5, 6, 7, 8 and 9b, each with that round's settings), on
# data rebuilt on this machine by scripts/data/build_all.sh. The rest of v0.3's chain (v11 counting recovery, the
# v12 extension pack, r14b with the top SigLIP layers unfrozen) follows in round 17 once that data is built.
# The align stage runs from configs/r16-align.yaml (split so it could start before this data existed).
# Precision: the align stage is fp32; the decision stages' `amp` is set in `common` after the bf16 / off comparison
# (TODO.md section 3) -- until then this file is not to be run past the align stage.
#   UV_NO_SYNC=1 HF_HUB_OFFLINE=1 nohup uv run devision-pipeline configs/r16-cuda-chain.yaml > runs/r16-cuda-chain.out 2>&1 &
name: r16-cuda-chain
device: cuda
swanlab_project: ""          # not logged in on this machine yet (uv run swanlab login); logs stay in runs/<name>/logs
common:
  log_every: 50

stages:
  - name: s3                 # round 3: one pass over the data-v2 mix (134,556)
    kind: train
    init: runs/r16-align/align       # configs/r16-align.yaml
    data: data/v2/train_mix.jsonl
    val: data/v2/dev_mix_half.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 2000}

  - name: s5                 # round 5: reasoning, diagrams, above/below + 30,000 replayed (62,164)
    kind: train
    init: s3
    data: data/v3/train_cont.jsonl
    val: data/v3/dev_mix.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 2000}

  - name: s6                 # round 6: 12,000 left/right mirror pairs + replay
    kind: train
    init: s5
    data: data/v6/train_flip_mix.jsonl
    val: data/v3/dev_mix.jsonl
    eval: {lr_pairs: data/v6/dev_lr_pairs.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 300, eval_every: 1000}

  - name: s7                 # round 7: ScienceQA + replay + left/right pairs
    kind: train
    init: s6
    data: data/v4/train_sqa_mix.jsonl
    val: data/v4/dev_mix.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 300, eval_every: 1000}

  - name: s8                 # round 8: VSR + Visual7W + ScienceQA + replay + pairs
    kind: train
    init: s7
    data: data/v5/train_mix.jsonl
    val: data/v5/dev_mix.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 300, eval_every: 1000}

  - name: s9                 # round 9b: 2,488 real left/right questions + 2,500 replay, two passes
    kind: train
    init: s8
    data: data/v9/x1_r2500/train.jsonl
    val: data/v5/dev_mix.jsonl
    eval: {lr_pairs: data/v6/dev_lr_pairs.jsonl}
    params: {epochs: 2, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 50, eval_every: 1000}

evaluate:
  image_identity: data/v5/image_identity.json
  controls: true
  sets:
    dev_mix: data/v5/dev_mix.jsonl
    test_vsr: data/v5/test_vsr.jsonl
    test_v7w: data/v5/test_v7w.jsonl
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
    test_position_flip: data/v6/test_position_flip.jsonl
    test_relation_flip: data/v6/test_relation_flip.jsonl
    bench_lv_vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl
    bench_lv_aokvqa: data/lv_bench/aokvqa.jsonl
    bench_lv_scienceqa: data/lv_bench/scienceqa.jsonl
    bench_lv_pope: data/lv_bench/pope.jsonl
