# exp40 arm M (docs/experiments/2026-10-18-exp40-pair-plan.md; critic EXP40-PREP-01): decision training from
# exp37-L's end at 256 on data/exp40/train_M.jsonl -- B's blocks, the real-layout block as 300 + 300 families
# asked twice, the second exposure on exp37's L picture of the same scene. Settings as candidate B's at 256.
name: exp40-m
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/exp37-l/stage1
  data: data/exp40/train_M.jsonl
  val: data/r13b/val.jsonl
  eval:
    rl_tune: data/real_layout/questions_tune.jsonl
    sqa_temp: data/exp21/dev_sqa_temp.jsonl
    sqa_force: data/exp21/dev_sqa_force.jsonl
    sqa_temp_mism: data/exp21/dev_sqa_temp_mism.jsonl
    sqa_force_mism: data/exp21/dev_sqa_force_mism.jsonl
    exist: data/r13b/panel_exist.jsonl
    science: data/r13b/panel_science.jsonl
    dev16: data/exp22/dev16.jsonl
    exp31: data/exp31/text_force.jsonl
    semantics_tune: data/exp34/semantics_tune.jsonl
  params:
    epochs: 1
    micro_batch: 8
    eval_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 1650
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
