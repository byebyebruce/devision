# exp48 arm X (docs/experiments/2026-10-18-exp48-interaction-plan.md; critic EXP48-PREP-02): from EXP45-G's frozen end
# (c34b43dd / 2a5dfa64, question conditioning kept, no region loss), exp42's 576 updates, gold CE; interaction weight 1.0
# (data/exp48/quads.jsonl; computed for monitoring in both arms). C and X differ only in name and interaction_weight.
name: exp48-x
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/exp45-g/stage2
  data: data/exp42/train.jsonl
  val: data/exp42/val_sub.jsonl
  params:
    epochs: 1
    objective: ce
    question_conditioning: true
    lr_cond: 1.0e-04
    interaction_file: data/exp48/quads.jsonl
    interaction_weight: 1.0
    micro_batch: 8
    eval_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 0
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
