# Round 16, stage 1 on its own: round 2's align (COCO captions of every train2014 picture, projector + LoRA on
# ModernBERT, 2 epochs, fp32) on local CUDA. Split from configs/r16-cuda-chain.yaml so it can start while
# build_all.sh is still producing the decision data (the pipeline checks every file of a config before starting);
# r16-cuda-chain starts from runs/r16-align/align. Plan: docs/experiments/2026-10-20-r16-cuda-scratch-plan.md.
#   UV_NO_SYNC=1 HF_HUB_OFFLINE=1 nohup uv run devision-pipeline configs/r16-align.yaml > runs/r16-align.out 2>&1 &
name: r16-align
device: cuda
swanlab_project: ""          # not logged in on this machine yet (uv run swanlab login); logs stay in runs/<name>/logs
common:
  log_every: 50

stages:
  - name: align
    kind: align
    data: data/align_full_train.jsonl
    val: data/align_val.jsonl
    params: {epochs: 2, eval_every: 500, lora_r: 16, lr_lora: 1.0e-4}
