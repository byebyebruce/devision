# exp32 stage B (docs/experiments/2026-10-17-exp32-bridge-plan.md): decisions. From stage A2, r15's stage-2
# settings (top 4 SigLIP layers at 5e-6, learning rates, seed 1), warmup 100, one pass over r14b replay 12,000 +
# real-layout questions 9,716 + exp25 panels 2,401 (~3,015 steps), run to the end so the checkpoint is saved and
# its temperatures fitted on r13b's val (as r15).
name: exp32-fit
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/exp32-align/stage1
  data: data/exp32/train_mix.jsonl
  val: data/r13b/val.jsonl
  eval:
    rl_tune: data/real_layout/questions_tune.jsonl
    sqa_temp: data/exp21/dev_sqa_temp.jsonl
    sqa_force: data/exp21/dev_sqa_force.jsonl
    sqa_temp_mism: data/exp21/dev_sqa_temp_mism.jsonl
    sqa_force_mism: data/exp21/dev_sqa_force_mism.jsonl
    exist: data/r13b/panel_exist.jsonl
    science: data/r13b/panel_science.jsonl
    dev16: data/exp22/dev16.jsonl
  params:
    epochs: 1
    micro_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 1000
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
