# Round 10 screen A1 (critic/plan-round10.md section 4, stage A; not a round): does a focused run on the 194 real
# ScienceQA attract / repel questions (data/v4/scienceqa.jsonl, repeated to 2,400 question views = 300 steps;
# scripts/data/v10_focus.py, data/v10/focus_repel.MANIFEST.json) raise accuracy on the monitoring set's attract /
# repel questions (ScienceQA official test split, 52)? From v9b; warmup 30 = 10% of the run, learning rate and
# sigma anneal over the 300 steps. The val set gets its temperature fitted (monitoring only; the decision uses
# argmax). Decision (plan section 4): accuracy vs v9b, lower bound > 0 and >= +8 points, picture-gain change > 0.
#   uv run devision-pipeline configs/r10-a1-repel.yaml
name: r10-a1-repel
device: mps
common:
  log_every: 25

stages:
  - name: stage2
    kind: train
    init: runs/v9b-lr-replay/stage2
    data: data/v10/focus_repel.jsonl
    val: data/v10/dev_sqa_repel.jsonl
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 30, eval_every: 100}

evaluate:
  image_identity: data/v5/image_identity.json
  controls: true
  sets:
    dev_sqa_repel: {path: data/v10/dev_sqa_repel.jsonl, role: monitoring}
