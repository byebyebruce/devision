# Round 5: continue round 3 with what data-v3 adds -- common-sense reasoning and textbook diagrams (A-OKVQA,
# ScienceQA, AI2D, TQA train splits) and the above/below relation questions (32,164 in all) -- plus 30,000
# questions replayed from data-v2's mix. Round 3 already made one pass over data-v2's mix; passing over it
# again would repeat it (round 4 showed repeats make the model over-confident). One pass, 62,164 questions.
# Data: scripts/data/v3_build.py then scripts/data/v5_mix.py (out of the repo); docs/research/data-quality.md.
#   uv run devision-pipeline configs/v5-data3.yaml
name: v5-data3
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v3-data2/stage2              # the current best (round 4 regressed on GQA)
    data: data/v3/train_cont.jsonl          # 62,164 = 32,164 new + 30,000 replayed
    val: data/v3/dev_mix.jsonl              # 4,531: dev of the new sets + data/v2/dev_mix_half; temperature fit
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 2000}

evaluate:
  image_identity: data/v2/image_identity.json
  controls: true                           # + mismatched pictures and reversed options for every set
  sets:
    dev_mix: data/v3/dev_mix.jsonl         # calibration_fit: reported, but not a held-out result
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
  commands:
    - uv run devision-pipeline configs/v5-data3-lvbench.yaml   # then laya-vision's benchmark (no controls)
