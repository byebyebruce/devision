# exp30 (docs/experiments/2026-10-17-exp30-align-replay-plan.md; critic V04-PREP-02): exp24 phase A with one change,
# the data -- half exp24's text pictures, half isolated real COCO caption pictures (scripts/exp30/isolate.py), one
# pass of 40,000 = 2,500 steps, the same optimizer steps, init, learning rates, LoRA, frozen tower and loss.
name: exp30-align-replay
device: mps
common:
  log_every: 50
stages:
- name: stage1
  kind: align
  init: runs/r15-vision/stage2
  data: data/exp30/align_mix.jsonl
  val: data/exp24/align_val.jsonl
  params:
    epochs: 1
    batch: 16
    lr: 2.0e-05
    lora_r: 16
    lora_alpha: 32
    lr_lora: 1.0e-04
    warmup: 100
    mask_prob: 0.5
    max_caption_tokens: 40
    eval_every: 500
    seed: 0
