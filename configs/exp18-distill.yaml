# exp18 (docs/experiments/2026-10-13-exp18-distill-plan.md; owner 2026-10-13: tests first, critic review, then train):
# exp16-r14-s1 exactly (r14 mix, seed 1, r14's schedule over 10,235 steps, stopped by scripts/exp18/chain.sh once the
# step-2000 monitor records are written) plus one term: on the questions of r14's replay blocks, KL(v12 || student)
# over the options at temperature 1, weight 1, per micro batch of 8. RLCD and gold unchanged on every question;
# count_balanced and pixmo are not constrained. Baseline B = runs/exp16-r14-s1 (reused): before the first update the
# step-0 records must match B's (start_check), else training stops with START_MISMATCH. Readout scripts/exp18/report.py.
name: exp18-distill
device: mps
common:
  log_every: 100

stages:
  - name: stage2
    kind: train
    init: runs/v12-ext/stage2
    data: data/r14/train.jsonl
    val: data/r13b/val.jsonl
    eval: {exist: data/r13b/panel_exist.jsonl, science: data/r13b/panel_science.jsonl, ext: data/ext/dev_ext.jsonl,
           bind_gqa: data/r13/gqa/dev_bind_gqa.jsonl, count_narrow: data/v11/dev_count_transfer.jsonl,
           count_wide: data/r13b/count_wide.jsonl, px_wide: data/exp14/pixmo_count_wide.jsonl,
           px_narrow: data/exp14/pixmo_count_narrow.jsonl, px_exist: data/exp14/pixmo_exist.jsonl,
           flip: data/v6/dev_lr_pairs.jsonl, vsr: data/v5/dev_vsr.jsonl}
    params: {epochs: 1, lr_new: 2.0e-5, lr_head: 1.0e-5, lr_lora: 5.0e-5, warmup: 300, eval_every: 2000,
             save_every: 500, amp: "off", seed: 1, monitor_details: true,
             distill_weight: 1.0, distill_teacher: runs/v12-ext/stage2,
             distill_blocks: "existence,count_original,science,general,ext",
             start_check: runs/exp16-r14-s1/stage2/monitor/step0, start_tolerance: 1.0e-5}

