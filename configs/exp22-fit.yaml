# exp22 (docs/experiments/2026-10-16-exp22-fit-plan.md; owner 2026-10-16 "可以先做测试"): after exp21 (r15 did not
# learn to read printed numbers at any height in a 1:1 synthetic + replay mix), can r15 fit the synthetic reading
# task at all when trained on it alone, at the largest height (16 px)? Init r15 with exp21's settings (top 4
# SigLIP layers at 5e-6, learning rates, seed 1, warmup 100); data scripts/exp22/build.py (synthetic only, both
# value views); val = 200 of the training families (the fit measure); stopped by scripts/exp22/chain.sh once step
# 2000 is recorded; readout scripts/exp22/report.py. Not a round, no adoptable model.
name: exp22-fit
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/r15-vision/stage2
  data: data/exp22/train.jsonl
  val: data/exp22/fit.jsonl
  eval:
    dev16: data/exp22/dev16.jsonl
    dev: data/exp21/dev_syn.jsonl
    erased: data/exp21/dev_syn_erased.jsonl
    text: data/exp21/dev_syn_text.jsonl
  params:
    epochs: 1
    micro_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 500
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
