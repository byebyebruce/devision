# Round 6: left/right counterfactual pairs. Every earlier fix left left/right at chance (docs/experiments/
# 2026-09-30-rlcd-plateau.md); here each left/right question comes with the same question on the mirrored
# picture and the answer swapped, so names and option order cannot answer it (docs/research/data-quality.md).
# Data: scripts/data/v6_flip.py (and --dev), then scripts/data/v6_mix.py (out of the repo):
# 12,000 pairs (relation first: 7,065 relation + 4,935 position, <= 3 per picture) + 24,000 replayed questions
# from data-v3 without left/right ones (minimum per ability first: counting, colour, above/below, size, GQA,
# the reasoning and diagram sets), hints cut to ~150 tokens; one pass.
# Mirrored test sets: scripts/data/v6_flip.py --files test_position|test_relation --out <name>_flip.jsonl.
#   uv run devision-pipeline configs/v6-flip-lr.yaml
name: v6-flip-lr
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v5-data3/stage2              # the current best (round 5)
    data: data/v6/train_flip_mix.jsonl      # 48,000 = 12,000 left/right pairs + 24,000 replayed
    val: data/v3/dev_mix.jsonl              # temperature fit (calibration_fit)
    eval: {lr_pairs: data/v6/dev_lr_pairs.jsonl}   # 772 dev left/right questions + their mirrors
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 300, eval_every: 1000}

evaluate:
  image_identity: data/v2/image_identity.json
  controls: true                           # + mismatched pictures and reversed options for every set
  sets:
    dev_mix: data/v3/dev_mix.jsonl         # calibration_fit: reported, but not a held-out result
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
    test_position_flip: data/v6/test_position_flip.jsonl   # left/right test questions on mirrored pictures:
    test_relation_flip: data/v6/test_relation_flip.jsonl   # right on both a question and its mirror = grounded
    bench_lv_vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl   # laya-vision's benchmark: their questions,
    bench_lv_aokvqa: data/lv_bench/aokvqa.jsonl             # compare with their published rows
    bench_lv_scienceqa: data/lv_bench/scienceqa.jsonl       # (scripts/data/lv_bench.py, devision-compare)
    bench_lv_pope: data/lv_bench/pope.jsonl
