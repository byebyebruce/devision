# exp39 arm H (docs/experiments/2026-10-17-exp39-lowmem-plan.md; critic EXP39-PREP-01): exp38-H run with micro_batch 8
# (effective batch 16, one optimizer step per 16 rows) -- exp37-L's weights read at 512 (runs/exp38-init-512, checked
# conversion), exp36's original-picture 16,000 rows, full-number mask, 1,000 steps; differs from configs/exp38-h.yaml
# only in name and micro_batch.
name: exp39-h
device: mps
common:
  log_every: 50
stages:
- name: stage1
  kind: align
  init: runs/exp38-init-512
  data: data/exp36/align_mix.jsonl
  val: data/real_layout/captions_tune.jsonl
  params:
    epochs: 1
    batch: 16
    lr: 2.0e-05
    lora_r: 16
    lora_alpha: 32
    lr_lora: 1.0e-04
    warmup: 100
    mask_prob: 0.5
    max_caption_tokens: 44
    eval_every: 500
    seed: 0
    track_sources: real-layout-temp,real-layout-force
    number_mask_sources: real-layout-temp,real-layout-force
    micro_batch: 8
