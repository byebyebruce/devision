- {name: sqa_temp, data: data/exp21/dev_sqa_temp.jsonl, temperature: fitted, control: none, role: monitoring}
- {name: sqa_force, data: data/exp21/dev_sqa_force.jsonl, temperature: fitted, control: none, role: monitoring}
- {name: sqa_temp_mism, data: data/exp21/dev_sqa_temp_mism.jsonl, temperature: fitted, control: none, role: monitoring}
- {name: sqa_force_mism, data: data/exp21/dev_sqa_force_mism.jsonl, temperature: fitted, control: none, role: monitoring}
# new ability kept: dev16 with exp26's rule, and its erased-digit control
- {name: dev16, data: data/exp22/dev16.jsonl, temperature: fitted, control: none, role: monitoring}
- {name: syn_erased, data: data/exp21/dev_syn_erased.jsonl, temperature: fitted, control: none, role: monitoring}
