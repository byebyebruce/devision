# exp24 phase B (docs/experiments/2026-10-16-exp24-read-align-plan.md): exp22's fit test, unchanged except the init --
# the phase-A checkpoint (r15 + reading alignment) instead of r15. exp22 (runs/exp22-fit) is the control.
name: exp24-fit
device: mps
common:
  log_every: 100
stages:
- name: stage2
  kind: train
  init: runs/exp24-align/stage1
  data: data/exp22/train.jsonl
  val: data/exp22/fit.jsonl
  eval:
    dev16: data/exp22/dev16.jsonl
    dev: data/exp21/dev_syn.jsonl
    erased: data/exp21/dev_syn_erased.jsonl
    text: data/exp21/dev_syn_text.jsonl
  params:
    epochs: 1
    micro_batch: 8
    lr_new: 2.0e-05
    lr_head: 1.0e-05
    lr_lora: 5.0e-05
    warmup: 100
    eval_every: 500
    save_every: 500
    amp: 'off'
    seed: 1
    monitor_details: true
    vision_unfreeze_top: 4
    lr_vision: 5.0e-06
