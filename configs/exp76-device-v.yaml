# EXP76 device V stage (DEVICE-V-IMPL-PREP-01; docs/experiments/2026-10-20-exp76-device-plan.md section 2): the EXP76 r2
# config but for the name / output directory -- start R, data, the 1,054-update schedule, seed, amp off and the monitored
# sets unchanged. The V runner (scripts/device_v/run_v.sh) stops it on purpose after the 250th update (planned_stop); no
# checkpoint, no scientific outcome, never resumed.
name: exp76-device-v
device: mps
common:
  log_every: 25
stages:
  - name: d2
    kind: train
    init: runs/exp75-panel-r/r
    data: data/panel_learn/train.jsonl
    val: data/panel_learn/fit.jsonl
    eval:
      dev16: data/panel_learn/dev16.jsonl
      erased: data/panel_learn/erased.jsonl
      k_text: data/protect_p/slice_K_text.jsonl
      rs_temp: data/panel_learn/read_states_sqa_temp.jsonl
      rs_force: data/panel_learn/read_states_sqa_force.jsonl
      rs_temp_mism: data/panel_learn/read_states_sqa_temp_mism.jsonl
      rs_force_mism: data/panel_learn/read_states_sqa_force_mism.jsonl
    params:
      epochs: 1
      mixed_input: true
      objective: ce
      micro_batch: 8
      eval_batch: 8
      lora_r: 16
      lr_lora: 5.0e-5
      lr_head: 1.0e-5
      warmup: 100
      eval_every: 0
      save_every: 0
      amp: "off"
      seed: 1
      monitor_details: true
evaluate:
  checkpoint: d2
  controls: false
  sets:
    exist: {path: data/r13b/panel_exist.jsonl, role: monitoring}
    science: {path: data/r13b/panel_science.jsonl, role: monitoring}
