# The released checkpoint (deVision 0.1; round 1, runs/v1-release-0.1/stage2b): ~16 h on a Mac (MPS).
#   uv run devision-pipeline configs/v1-release-0.1.yaml
# Data files come from the converters in scripts/data/ and the analysis commands from runs/analysis/,
# both kept out of the repo (see CLAUDE.md).
name: v1-release-0.1
description: >
  Stage 1 aligns the projector on COCO captions; stage 2 trains decisions on GQA + VQAv2, then on
  questions generated from COCO instance boxes with replayed stage-2a questions.
device: mps
common:
  log_every: 50

stages:
  - name: align
    kind: align
    data: data/align_full_train.jsonl
    val: data/align_val.jsonl
    params: {epochs: 2, eval_every: 500}

  - name: stage2a            # 60k GQA + 40k VQAv2 yes/no; lower LRs + warm-up, or a run this long collapses
    kind: train
    init: align
    data: data/train_100k.jsonl
    val: data/val_mix.jsonl
    eval: {pope: data/pope.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 500}

  - name: stage2b            # 57k COCO-box questions + 23k replayed from train_100k
    kind: train
    init: stage2a
    data: data/train_cocoqa_mix.jsonl
    val: data/val_mix.jsonl
    eval: {pope: data/pope.jsonl, cocoqa: data/val_cocoqa.jsonl}
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 1000}

evaluate:
  image_identity: data/v2/image_identity.json   # COCO / VG ids of one picture match when roles are decided
  checkpoint: stage2b
  sets:
    val_gqa: data/val_gqa.jsonl
    val_vqav2: data/val_vqav2.jsonl
    pope: data/pope.jsonl
    val_cocoqa: data/val_cocoqa.jsonl
  commands:
    - uv run python runs/analysis/gqa_by_type.py {checkpoint} > {eval_dir}/gqa_by_type.txt 2>&1
    - uv run python runs/analysis/cocoqa_by_kind.py {checkpoint} > {eval_dir}/cocoqa_by_kind.txt 2>&1
