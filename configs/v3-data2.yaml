# Stage 2 on the data-v2 mix, from round 2's LoRA-aligned stage 1 (runs/v2-align-lora/align). Compare with
# configs/v2-align-lora-testsets.yaml: the same stage 1 + data-v1, on the same test sets and controls.
#   uv run devision-pipeline configs/v3-data2.yaml       # round 3, runs/v3-data2/
# Data: scripts/data/v2_build.py then scripts/data/v2_mix.py (out of the repo); see docs/research/data-quality.md.
name: v3-data2
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v2-align-lora/align
    data: data/v2/train_mix.jsonl          # 134,556 questions, left/right 4.1%, <= 6 per picture
    val: data/v2/dev_mix_half.jsonl        # monitoring, temperature fit (calibration_fit); half of dev_mix by picture
                                           # (scripts/data/v2_dev_half.py), from step 4000 on -- steps 0-4000 used all of dev_mix
    params: {epochs: 1, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 500, eval_every: 2000}

evaluate:
  image_identity: data/v2/image_identity.json
  controls: true                           # + mismatched pictures and reversed options for every set
  sets:
    dev_mix_half: data/v2/dev_mix_half.jsonl   # calibration_fit: reported, but not a held-out result
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
