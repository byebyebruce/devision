# Round 9: R's real-photo left/right questions plus replay on top (docs/experiments/2026-10-05-v9b-lr-replay-plan.md,
# revision 1, review passed). A focused run on real left/right questions learns them from v8 (R: held-out position
# both-right +45.2 points); mixing them into a fixed budget did not keep the gain (S-mix), keeping R's own 2,488
# questions and two passes with 2,500 replay on top did (screen X1 on dev_lr_pairs: position +31.9 [+27.4, +36.4],
# old-ability slice of dev_mix -0.63, no source alarm). This round retrains X1's recipe from v8; the only change is
# val = dev_mix for the temperature fit (scripts/data/v9_mix.py --pairs-file data/v9/r_pairs.jsonl --replay 2500,
# data/v9/x1_r2500/MIX.json). Acceptance rules (written before training, plan section 4): position both-right on
# the held-out mirrored sets against v8 (scripts/pair_stats.py --base --mismatched), picture-gain change > 0, every
# other test_ / bench_lv_ set against v8 with lower bound > -2, scripts/lv_report.py against v8.
#   uv run devision-pipeline configs/v9b-lr-replay.yaml
name: v9b-lr-replay
device: mps
common:
  log_every: 50

stages:
  - name: stage2
    kind: train
    init: runs/v8-vsr-v7w/stage2            # the current best (round 8)
    data: data/v9/x1_r2500/train.jsonl      # R's 2,488 left/right questions + 2,500 replay (MIX.json)
    val: data/v5/dev_mix.jsonl              # temperature fit (calibration_fit)
    eval: {lr_pairs: data/v6/dev_lr_pairs.jsonl}   # left/right monitoring, 772 pairs
    params: {epochs: 2, lr_new: 5.0e-5, lr_head: 5.0e-5, lr_lora: 1.0e-4, warmup: 50, eval_every: 1000}

evaluate:
  image_identity: data/v5/image_identity.json
  controls: true                           # + mismatched pictures and reversed options for every set
  sets:
    dev_mix: data/v5/dev_mix.jsonl         # calibration_fit: reported, but not a held-out result
    test_vsr: data/v5/test_vsr.jsonl
    test_v7w: data/v5/test_v7w.jsonl
    bench_pope: data/v2/bench_pope.jsonl
    test_vqa_yesno: data/v2/test_vqa_yesno.jsonl
    test_vqa_choice: data/v2/test_vqa_choice.jsonl
    test_gqa: data/v2/test_gqa.jsonl
    test_exist: data/v2/test_exist.jsonl
    test_position: data/v2/test_position.jsonl
    test_relation: data/v2/test_relation.jsonl
    test_size: data/v2/test_size.jsonl
    test_position_flip: data/v6/test_position_flip.jsonl   # left/right on mirrored pictures: both right = grounded
    test_relation_flip: data/v6/test_relation_flip.jsonl
    bench_lv_vqav2_yesno: data/lv_bench/vqav2_yesno.jsonl   # laya-vision's benchmark
    bench_lv_aokvqa: data/lv_bench/aokvqa.jsonl
    bench_lv_scienceqa: data/lv_bench/scienceqa.jsonl
    bench_lv_pope: data/lv_bench/pope.jsonl
